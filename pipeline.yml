# Checks run inside the pipeline's worker image (Debian, Python 3), from the repo root.
setup: "python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet numpy scipy pytest"
fast_check: "/tmp/venv/bin/python -m pytest -q -p no:cacheprovider"
full_check: "/tmp/venv/bin/python -m pytest -q -p no:cacheprovider"

paths:
  tests:
    - "tests/**"
  docs:
    - "README.md"
  manual_merge:
    - "pipeline.yml"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "WORKFLOW.md"
